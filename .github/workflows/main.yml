name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install PDF validator
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '3.4'
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: bundle exec rake
      - name: Validate RBS signatures
        shell: bash
        run: bundle exec rbs -I sig -I "$(bundle info --path alhena)/sig" validate
      - name: Verify runtime dependency isolation
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '3.4'
        shell: bash
        run: test -z "$(git grep -iE 'zaniah|syrma|canopus|beid|furud|denebola' -- lib || true)"
      - run: gem build --strict okab.gemspec
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: okab-${{ matrix.os }}-${{ matrix.ruby }}
          path: .rspec_status
