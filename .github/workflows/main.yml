name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install PDF validation tools
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '3.4'
        run: sudo apt-get update && sudo apt-get install -y qpdf poppler-utils
      - run: bundle exec rake
      - name: Validate RBS signatures
        shell: bash
        run: bundle exec rbs -I sig -I "$(bundle info --path alhena)/sig" validate
      - name: Verify runtime dependency isolation
        if: matrix.os == 'ubuntu-24.04' && matrix.ruby == '3.4'
        shell: bash
        run: |
          bundle exec ruby -Ilib -e 'require "okab"; abort "core Okab loaded Zaniah" if defined?(::Zaniah)'
          bundle exec ruby -e '
            spec = Gem::Specification.load("okab.gemspec")
            blocked = %w[zaniah syrma canopus beid furud denebola]
            abort "unexpected runtime dependency" if spec.runtime_dependencies.any? { |dependency| blocked.include?(dependency.name) }
          '
      - run: gem build --strict okab.gemspec
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: okab-${{ matrix.os }}-${{ matrix.ruby }}
          path: .rspec_status
